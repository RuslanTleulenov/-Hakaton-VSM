<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="21" font-weight="bold" fill="#111827">Один ход проводника</text>
  <text x="30" y="60" font-size="13" fill="#6b7280">Время решения считает сервер: браузер не передаёт длительность вообще.</text>

  <!-- lifelines -->
  <g font-size="12" fill="#111827">
    <rect x="30" y="80" width="130" height="34" rx="6" fill="#eef4ff" stroke="#93b4f5"/>
    <text x="50" y="102">Браузер</text>
    <rect x="215" y="80" width="130" height="34" rx="6" fill="#f6f7f9" stroke="#cbd5e1"/>
    <text x="243" y="102">main.py</text>
    <rect x="400" y="80" width="130" height="34" rx="6" fill="#f6f7f9" stroke="#cbd5e1"/>
    <text x="424" y="102">service.py</text>
    <rect x="585" y="80" width="130" height="34" rx="6" fill="#fef2f2" stroke="#f5a3a3"/>
    <text x="613" y="102">engine.py</text>
    <rect x="762" y="80" width="108" height="34" rx="6" fill="#f0fdf4" stroke="#86d3a6"/>
    <text x="790" y="102">SQLite</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="95" y1="114" x2="95" y2="520"/>
    <line x1="280" y1="114" x2="280" y2="520"/>
    <line x1="465" y1="114" x2="465" y2="520"/>
    <line x1="650" y1="114" x2="650" y2="520"/>
    <line x1="816" y1="114" x2="816" y2="520"/>
  </g>

  <g stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a2)">
    <line x1="95" y1="150" x2="278" y2="150"/>
    <line x1="280" y1="196" x2="463" y2="196"/>
    <line x1="465" y1="242" x2="814" y2="242"/>
    <line x1="465" y1="298" x2="648" y2="298"/>
    <line x1="650" y1="368" x2="467" y2="368"/>
    <line x1="465" y1="414" x2="814" y2="414"/>
    <line x1="280" y1="480" x2="97" y2="480"/>
    <line x1="465" y1="460" x2="282" y2="460"/>
  </g>

  <g font-size="12" fill="#111827">
    <text x="104" y="144">POST /runs/{id}/choose  {"option_id": "radio"}</text>
    <text x="289" y="190">service.choose(run_id, content, option_id)</text>
    <text x="474" y="236">SELECT state, node_shown_at</text>
    <text x="474" y="292">engine.choose(scenario, state, option_id, seconds = now − node_shown_at)</text>
    <text x="474" y="362" fill="#b91c1c">эффекты · порядок шагов ролевой модели · таймаут · переход (goto / goto_if)</text>
    <text x="474" y="408">INSERT run_events · UPDATE runs (state, node_shown_at)</text>
    <text x="291" y="454">узел, шкалы, причины, альтернатива</text>
    <text x="104" y="474">следующий узел + таймер, или разбор рейса</text>
  </g>

  <rect x="474" y="318" width="360" height="34" rx="6" fill="#fff7ed" stroke="#f0b27a"/>
  <text x="486" y="340" font-size="11" fill="#9a3412">инцидент закончился, но рейс продолжается → continue_trip: шкалы и память едут дальше</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
