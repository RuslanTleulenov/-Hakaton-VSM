<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="21" font-weight="bold" fill="#111827">«Перегон» — компоненты решения</text>
  <text x="30" y="62" font-size="13" fill="#6b7280">Фронтенд и бэкенд разделены: общение только через REST. Ядро не знает ни про HTTP, ни про БД.</text>

  <!-- Frontend -->
  <rect x="30" y="86" width="840" height="92" rx="10" fill="#eef4ff" stroke="#93b4f5"/>
  <text x="46" y="110" font-size="15" font-weight="bold" fill="#1d4ed8">Frontend · браузер (HTML + CSS + JS, без сборки)</text>
  <rect x="46" y="122" width="180" height="42" rx="7" fill="#ffffff" stroke="#c7d8f7"/>
  <text x="60" y="140" font-size="12" fill="#111827">Каталог и рейс недели</text>
  <text x="60" y="156" font-size="11" fill="#6b7280">серии, сгорающие баллы</text>
  <rect x="238" y="122" width="180" height="42" rx="7" fill="#ffffff" stroke="#c7d8f7"/>
  <text x="252" y="140" font-size="12" fill="#111827">Партия: шкалы, таймер</text>
  <text x="252" y="156" font-size="11" fill="#6b7280">память рейса, прогресс</text>
  <rect x="430" y="122" width="180" height="42" rx="7" fill="#ffffff" stroke="#c7d8f7"/>
  <text x="444" y="140" font-size="12" fill="#111827">Разбор рейса</text>
  <text x="444" y="156" font-size="11" fill="#6b7280">причины, «что было бы»</text>
  <rect x="622" y="122" width="232" height="42" rx="7" fill="#ffffff" stroke="#c7d8f7"/>
  <text x="636" y="140" font-size="12" fill="#111827">Профиль · рейтинг · аналитика</text>
  <text x="636" y="156" font-size="11" fill="#6b7280">компетенции, ачивки, уведомления</text>

  <!-- REST arrow -->
  <line x1="450" y1="178" x2="450" y2="214" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="202" font-size="12" fill="#374151">REST /api/v1/* · OpenAPI на /docs</text>

  <!-- Backend -->
  <rect x="30" y="214" width="840" height="252" rx="10" fill="#f6f7f9" stroke="#cbd5e1"/>
  <text x="46" y="238" font-size="15" font-weight="bold" fill="#111827">Backend · FastAPI</text>

  <rect x="46" y="250" width="390" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="270" font-size="13" font-weight="bold" fill="#111827">main.py — HTTP</text>
  <text x="60" y="290" font-size="11" fill="#6b7280">валидация запросов, коды 404/409/422/401, раздача SPA</text>

  <rect x="450" y="250" width="404" height="56" rx="7" fill="#fff7ed" stroke="#f0b27a"/>
  <text x="464" y="270" font-size="13" font-weight="bold" fill="#9a3412">Интеграции HR / LMS</text>
  <text x="464" y="290" font-size="11" fill="#92400e">X-API-Key: выгрузка прогресса, назначение обучения</text>

  <rect x="46" y="318" width="808" height="60" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="338" font-size="13" font-weight="bold" fill="#111827">service.py — прикладной слой</text>
  <text x="60" y="358" font-size="11" fill="#6b7280">партии и рейсы · время решения по часам сервера · профиль, достижения, рейтинг, челлендж, серии, аналитика</text>

  <rect x="46" y="390" width="500" height="60" rx="7" fill="#fef2f2" stroke="#f5a3a3"/>
  <text x="60" y="410" font-size="13" font-weight="bold" fill="#b91c1c">engine.py — ядро (детерминированное)</text>
  <text x="60" y="430" font-size="11" fill="#7f1d1d">ветвление и условия · таймеры · две шкалы · ролевая модель · память рейса · итог</text>

  <rect x="560" y="390" width="294" height="60" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="574" y="410" font-size="13" font-weight="bold" fill="#111827">domain.py · loader.py</text>
  <text x="574" y="430" font-size="11" fill="#6b7280">типы сценария и рейса, YAML + валидация</text>

  <!-- Storage -->
  <line x1="240" y1="466" x2="240" y2="500" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="466" x2="660" y2="500" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="30" y="500" width="410" height="96" rx="10" fill="#f0fdf4" stroke="#86d3a6"/>
  <text x="46" y="524" font-size="14" font-weight="bold" fill="#166534">Storage · SQLite (db.py)</text>
  <text x="46" y="546" font-size="11" fill="#166534">conductors · runs · run_events · earned_achievements</text>
  <text x="46" y="564" font-size="11" fill="#166534">notifications · api_clients</text>
  <text x="46" y="584" font-size="11" fill="#4b7d5f">состояние партии в БД → бэкенд масштабируется без липких сессий</text>

  <rect x="460" y="500" width="410" height="96" rx="10" fill="#fdf7ff" stroke="#d8b4f0"/>
  <text x="476" y="524" font-size="14" font-weight="bold" fill="#6b21a8">Контент · YAML (правит методист)</text>
  <text x="476" y="546" font-size="11" fill="#6b21a8">content/scenarios/*.yaml — 6 сценариев, 53 узла</text>
  <text x="476" y="564" font-size="11" fill="#6b21a8">content/trips/*.yaml — 2 рейса · achievements.yaml — 12 ачивок</text>
  <text x="476" y="584" font-size="11" fill="#7c5295">validate.py: битые ссылки и пустые варианты — до запуска</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
